name: Release (Single Full APK)

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > .keystore

      - name: Build APK (apkstoreRelease)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :presentation:assembleApkstoreRelease -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Create GitHub Release (single APK)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            presentation/build/outputs/apk/apkstore/release/*.apk

