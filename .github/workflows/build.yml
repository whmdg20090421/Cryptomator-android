name: Build and Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > .keystore

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Install apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/
          sudo chmod +x /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool.jar

      - name: Decompile APK and grep for keywords
        run: |
          APK_FILE=$(find presentation/build/outputs/apk/ -name "*.apk" | grep release | head -n 1)
          echo "Found APK: $APK_FILE"
          
          if [ -n "$APK_FILE" ]; then
            apktool d "$APK_FILE" -o decompiled_apk
            # Grep for keywords and save to verification_report.txt
            echo "--- Grep for 'onLicenseInvalid' ---" >> verification_report.txt
            grep -R "onLicenseInvalid" decompiled_apk/smali/ || echo "Not found" >> verification_report.txt
            echo "--- Grep for 'LicenseCheckActivity' ---" >> verification_report.txt
            grep -R "LicenseCheckActivity" decompiled_apk/smali/ || echo "Not found" >> verification_report.txt
            echo "--- Grep for 'license' ---" >> verification_report.txt
            grep -R "license" decompiled_apk/smali/ || echo "Not found" >> verification_report.txt
            echo "--- Checking 'onSuccess' path in DoLicenseCheck ---" >> verification_report.txt
            grep -C 5 "onSuccess" decompiled_apk/smali/org/cryptomator/domain/usecases/DoLicenseCheck* || echo "Not found" >> verification_report.txt
          else
            echo "No APK found to decompile." > verification_report.txt
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            presentation/build/outputs/apk/**/*.apk
            verification_report.txt

      - name: Create Release and Upload APK
        if: github.ref == 'refs/heads/trae/solo-agent-oTMKwV'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "${LATEST_TAG}" ]; then
            LATEST_TAG="1.0.0"
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG}"
          if [ -z "${MAJOR}" ] || [ -z "${MINOR}" ] || [ -z "${PATCH}" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          fi
          NEXT_TAG="${MAJOR}.${MINOR}.$((PATCH + 1))"
          
          APK_FILE=$(find presentation/build/outputs/apk/ -name "*.apk" | grep release | head -n 1)
          if [ -z "${APK_FILE}" ]; then
            echo "No APK produced." >&2
            exit 1
          fi
          
          gh release view "${NEXT_TAG}" >/dev/null 2>&1 || gh release create "${NEXT_TAG}" --title "${NEXT_TAG}" --notes "Automated build from ${GITHUB_SHA}"
          gh release upload "${NEXT_TAG}" "${APK_FILE}" --clobber
